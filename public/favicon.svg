<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Background -->
  <rect width="128" height="128" rx="28" fill="#0F0D1A"/>

  <!-- Cassette body -->
  <rect x="14" y="36" width="100" height="56" rx="9" fill="none" stroke="#9D85FF" stroke-width="5"/>

  <!-- Left reel -->
  <circle cx="42" cy="57" r="14" fill="none" stroke="#9D85FF" stroke-width="4"/>
  <circle cx="42" cy="57" r="5" fill="#9D85FF"/>

  <!-- Right reel -->
  <circle cx="86" cy="57" r="14" fill="none" stroke="#9D85FF" stroke-width="4"/>
  <circle cx="86" cy="57" r="5" fill="#9D85FF"/>

  <!-- Tape window -->
  <rect x="28" y="74" width="72" height="12" rx="4" fill="none" stroke="#6C47F5" stroke-width="3"/>

  <!-- Corner notches -->
  <rect x="14" y="76" width="8" height="16" rx="2" fill="#6C47F5"/>
  <rect x="106" y="76" width="8" height="16" rx="2" fill="#6C47F5"/>
</svg>
