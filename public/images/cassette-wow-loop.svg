
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    
    <radialGradient id="h6-bg" cx="32%" cy="22%" r="100%">
      <stop offset="0%" stop-color="#faf6ee"/>
      <stop offset="55%" stop-color="#ece1cc"/>
      <stop offset="100%" stop-color="#dccdb4"/>
    </radialGradient>
    <linearGradient id="h6-orange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff7a3a"/>
      <stop offset="100%" stop-color="#d9531e"/>
    </linearGradient>
    <linearGradient id="h6-glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(255,255,255,0.85)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.18)"/>
    </linearGradient>
    <filter id="h6-blur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="48"/>
    </filter>
  
    <linearGradient id="h6-tape" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff7a3a"/>
      <stop offset="100%" stop-color="#d9531e"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#h6-bg)"/>

  <g filter="url(#h6-blur)" opacity="0.6">
    <ellipse cx="512" cy="700" rx="280" ry="160" fill="#ef6a3a" opacity="0.45"/>
  </g>

  <g transform="translate(512 520)">
    <!-- tape forming infinity / loop between two reels -->
    <path d="
      M -260 0
      C -260 -180, -60 -180, 0 0
      C 60 180, 260 180, 260 0
      C 260 -180, 60 -180, 0 0
      C -60 180, -260 180, -260 0
      Z"
      fill="none" stroke="url(#h6-tape)" stroke-width="46" stroke-linejoin="round"/>

    <!-- highlight -->
    <path d="
      M -240 -10
      C -240 -160, -80 -160, -20 -20"
      fill="none" stroke="rgba(255,255,255,0.55)" stroke-width="4" stroke-linecap="round"/>

    <!-- two reel hubs -->
    <circle cx="-260" cy="0" r="46" fill="#2a221b"/>
    <circle cx="-260" cy="0" r="14" fill="#fff7ef"/>
    <circle cx="260"  cy="0" r="46" fill="#2a221b"/>
    <circle cx="260"  cy="0" r="14" fill="#fff7ef"/>
  </g>

  <!-- subtle wordmark -->
  <text x="512" y="860"
    text-anchor="middle"
    font-family="ui-monospace,'SF Mono',Menlo,monospace"
    font-size="28" letter-spacing="20" fill="#2a221b" opacity="0.8">CASSETTE</text>
</svg>