<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="627" viewBox="0 0 1200 627">
  <defs>
    <radialGradient id="glow-a" cx="75%" cy="20%" r="55%" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#6C47F5" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#6C47F5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-b" cx="10%" cy="85%" r="45%" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#8060F7" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#8060F7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#9D85FF"/>
      <stop offset="45%"  stop-color="#C8BAFF"/>
      <stop offset="100%" stop-color="#EDE8FF"/>
    </linearGradient>
    <linearGradient id="phone-screen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#1A1632"/>
      <stop offset="100%" stop-color="#0F0D1A"/>
    </linearGradient>
    <pattern id="dots" x="0" y="0" width="36" height="36" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="rgba(255,255,255,0.045)"/>
    </pattern>
    <radialGradient id="phone-glow" cx="50%" cy="35%" r="50%" gradientUnits="objectBoundingBox">
      <stop offset="0%"   stop-color="#6C47F5" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#6C47F5" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="badge-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#6C47F5" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#8060F7" stop-opacity="0.15"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="627" fill="#0F0D1A"/>
  <rect width="1200" height="627" fill="url(#dots)"/>
  <rect width="1200" height="627" fill="url(#glow-a)"/>
  <rect width="1200" height="627" fill="url(#glow-b)"/>

  <!-- Phone mockup -->
  <rect x="830" y="54" width="290" height="520" rx="42" ry="42"
        fill="#0F0D1A" stroke="rgba(108,71,245,0.3)" stroke-width="1.5"/>
  <rect x="846" y="70" width="258" height="488" rx="32" ry="32"
        fill="url(#phone-screen)"/>
  <rect x="846" y="70" width="258" height="488" rx="32" ry="32"
        fill="url(#phone-glow)"/>
  <rect x="932" y="84" width="84" height="26" rx="13" fill="#0A0814"/>

  <!-- Album art placeholder -->
  <rect x="868" y="128" width="214" height="214" rx="20"
        fill="rgba(108,71,245,0.14)" stroke="rgba(108,71,245,0.18)" stroke-width="1"/>

  <!-- Cassette tape icon centered in album art -->
  <g transform="translate(975, 232)" fill="none">
    <rect x="-56" y="-38" width="112" height="76" rx="10"
          fill="rgba(108,71,245,0.12)" stroke="rgba(108,71,245,0.5)" stroke-width="1.5"/>
    <rect x="-38" y="6" width="76" height="22" rx="5"
          fill="rgba(10,8,20,0.65)" stroke="rgba(108,71,245,0.22)" stroke-width="1"/>
    <circle cx="-22" cy="-8" r="16" stroke="rgba(108,71,245,0.5)" stroke-width="1.5"/>
    <circle cx="-22" cy="-8" r="6"  fill="rgba(108,71,245,0.45)"/>
    <circle cx="22"  cy="-8" r="16" stroke="rgba(108,71,245,0.5)" stroke-width="1.5"/>
    <circle cx="22"  cy="-8" r="6"  fill="rgba(108,71,245,0.45)"/>
    <rect x="-56" y="24" width="10" height="14" rx="2"
          fill="rgba(108,71,245,0.18)" stroke="rgba(108,71,245,0.35)" stroke-width="1"/>
    <rect x="46"  y="24" width="10" height="14" rx="2"
          fill="rgba(108,71,245,0.18)" stroke="rgba(108,71,245,0.35)" stroke-width="1"/>
  </g>

  <!-- List rows -->
  <rect x="868" y="360" width="142" height="8" rx="4" fill="rgba(255,255,255,0.6)"/>
  <rect x="868" y="377" width="100" height="6" rx="3" fill="rgba(255,255,255,0.25)"/>
  <rect x="868" y="402" width="130" height="8" rx="4" fill="rgba(255,255,255,0.45)"/>
  <rect x="868" y="419" width="85"  height="6" rx="3" fill="rgba(255,255,255,0.2)"/>
  <rect x="868" y="444" width="118" height="8" rx="4" fill="rgba(255,255,255,0.35)"/>
  <rect x="868" y="461" width="94"  height="6" rx="3" fill="rgba(255,255,255,0.18)"/>

  <!-- Play controls -->
  <circle cx="975" cy="512" r="14" fill="rgba(108,71,245,0.75)"/>
  <polygon points="970,506 970,518 982,512" fill="white"/>
  <polygon points="1000,512 1016,502 1016,522" fill="rgba(255,255,255,0.5)"/>
  <polygon points="950,502 950,522 934,512" fill="rgba(255,255,255,0.5)"/>

  <!-- Left content -->
  <rect x="80" y="130" width="246" height="28" rx="14"
        fill="url(#badge-grad)" stroke="rgba(108,71,245,0.28)" stroke-width="1"/>
  <circle cx="101" cy="144" r="4" fill="#6C47F5"/>
  <text x="114" y="149"
        font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"
        font-size="11" font-weight="600" letter-spacing="1.2"
        fill="#9D85FF" text-anchor="start">NOW ON TESTFLIGHT</text>

  <text x="80" y="270"
        font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"
        font-size="96" font-weight="700" letter-spacing="-3.5"
        fill="white" text-anchor="start">Cassette</text>

  <text x="80" y="330"
        font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"
        font-size="28" font-weight="400" letter-spacing="-0.5"
        fill="rgba(255,255,255,0.55)" text-anchor="start">Your music, your server,</text>

  <text x="80" y="372"
        font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"
        font-size="28" font-weight="700" letter-spacing="-0.5"
        fill="url(#accent-grad)" text-anchor="start">your app.</text>

  <!-- Feature pills -->
  <rect x="80"  y="416" width="128" height="30" rx="15" fill="rgba(108,71,245,0.12)" stroke="rgba(108,71,245,0.25)" stroke-width="1"/>
  <text x="144" y="436"
        font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"
        font-size="11" font-weight="600" letter-spacing="0.5"
        fill="#9D85FF" text-anchor="middle">Native iOS &amp; macOS</text>

  <rect x="218" y="416" width="86"  height="30" rx="15" fill="rgba(108,71,245,0.12)" stroke="rgba(108,71,245,0.25)" stroke-width="1"/>
  <text x="261" y="436"
        font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"
        font-size="11" font-weight="600" letter-spacing="0.5"
        fill="#9D85FF" text-anchor="middle">Offline-first</text>

  <rect x="314" y="416" width="104" height="30" rx="15" fill="rgba(108,71,245,0.12)" stroke="rgba(108,71,245,0.25)" stroke-width="1"/>
  <text x="366" y="436"
        font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"
        font-size="11" font-weight="600" letter-spacing="0.5"
        fill="#9D85FF" text-anchor="middle">Open source</text>

  <rect x="428" y="416" width="98"  height="30" rx="15" fill="rgba(108,71,245,0.12)" stroke="rgba(108,71,245,0.25)" stroke-width="1"/>
  <text x="477" y="436"
        font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"
        font-size="11" font-weight="600" letter-spacing="0.5"
        fill="#9D85FF" text-anchor="middle">No tracking</text>

  <text x="80" y="500"
        font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"
        font-size="15" font-weight="400"
        fill="rgba(255,255,255,0.35)" text-anchor="start">Native Subsonic &amp; OpenSubsonic client. Connect to Navidrome, Airsonic, Gonic, and more.</text>

  <text x="80" y="560"
        font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"
        font-size="15" font-weight="600" letter-spacing="0.3"
        fill="rgba(108,71,245,0.85)" text-anchor="start">getcassette.app</text>
</svg>
